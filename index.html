<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="description" content="Decanti — rank, remember, and share every wine you've tried." />
    <meta name="theme-color" content="#12080c" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Decanti" />
    <title>Decanti — every wine, remembered</title>
    <script>
      try {
        var t = localStorage.getItem('decanti.theme');
        if (t === 'navy' || t === 'light' || t === 'classic') {
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', t === 'navy' ? '#1a3674' : t === 'light' ? '#ffffff' : '#12080c');
          }
        }
      } catch (e) {}
    </script>
    <script>
      try {
        if (/^(capacitor|ionic):/.test(window.location.protocol)) {
          document.documentElement.classList.add('native-app');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
