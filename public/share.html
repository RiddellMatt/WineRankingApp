<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A wine on Decanti</title>
    <meta
      name="description"
      content="Someone ranked a wine on Decanti. Open the app to rate your own bottles and keep them with friends."
    />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="A wine on Decanti" />
    <meta
      property="og:description"
      content="Rank every wine you try, and share the cellar with friends."
    />
    <meta property="og:image" content="https://decantiwine.com/icons/pwa-512.png" />
    <link rel="stylesheet" href="./guides.css" />
  </head>
  <body>
    <header>
      <a href="./">Decanti</a>
    </header>
    <main>
      <h1 id="wine-name">A wine on Decanti</h1>
      <p id="wine-meta"></p>
      <p id="wine-score"></p>
      <p>Rank the bottles you try, and keep the list with friends.</p>
      <a class="btn" id="open-web" href="./">Open Decanti</a>
      <a class="btn ghost" id="open-app" href="com.northline.decanti://invite">Open in the app</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var wine = params.get('wine')
        var winery = params.get('winery')
        var vintage = params.get('vintage')
        var score = params.get('score')
        var ref = params.get('ref') || ''
        if (wine) document.getElementById('wine-name').textContent = wine
        var meta = [vintage, winery].filter(Boolean).join(' · ')
        if (meta) document.getElementById('wine-meta').textContent = meta
        if (score) document.getElementById('wine-score').textContent = score
        var web = new URL('./', location.href)
        if (ref) web.searchParams.set('ref', ref)
        document.getElementById('open-web').href = web.toString()
        var scheme = 'com.northline.decanti://invite' + (ref ? '?ref=' + encodeURIComponent(ref) : '')
        var openApp = document.getElementById('open-app')
        if (/Android/i.test(navigator.userAgent)) {
          var query = ref ? '?ref=' + encodeURIComponent(ref) : ''
          openApp.href =
            'intent://invite' +
            query +
            '#Intent;scheme=com.northline.decanti;package=com.northline.decanti;S.browser_fallback_url=' +
            encodeURIComponent(web.toString()) +
            ';end'
        } else {
          openApp.href = scheme
        }
      })()
    </script>
  </body>
</html>
